# =============================================
# JEWELRY SHOP - APPLICATION CONFIGURATION
# =============================================

# Server
server.port=8080

# =============================================
# DATABASE - SQL SERVER
# =============================================
# Thay 'localhost' và 'sa' / 'your_password' theo máy của bạn
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=supermarket_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e5f8g9h0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7a8b9c0d1e2f3g4h5i6j7k8l9m0n1o2p3q4r5s6t7u8v9w0x1y2z3a4b5c6d7e8f9
app.jwt.expiration-ms=86400000
app.jwt.remember-me-expiration-ms=604800000


# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
# FILE UPLOAD
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Thu muc luu anh upload (tuong doi so voi thu muc chay project)
file.upload-dir=uploads

# =============================================
# SPRING SECURITY
# =============================================
spring.security.remember-me.key=jewelry-shop-remember-me-secret-key-2024

# =============================================
# LOGGING
# =============================================
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# GOOGLE GEMINI AI CONFIGURATION
# =============================================
# Nhập API Key Gemini của bạn để bật chế độ trò chuyện AI tự do của Google (để trống nếu muốn dùng bộ xử lý offline)
gemini.api.key=${GEMINI_API_KEY:}
